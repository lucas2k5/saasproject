<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" role="img" aria-label="KeepAIS logo">
  <defs>
    <linearGradient id="keepaisGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3be4ff" />
      <stop offset="55%" stop-color="#5a7bff" />
      <stop offset="100%" stop-color="#c066ff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g fill="url(#keepaisGradient)" filter="url(#glow)">
    <rect x="6" y="34" width="10" height="16" rx="2" />
    <rect x="20" y="26" width="10" height="24" rx="2" />
    <rect x="34" y="18" width="10" height="32" rx="2" />
    <path d="M4 44 L28 28 L46 16" stroke="url(#keepaisGradient)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M46 16 L56 16 L51 8 Z" />
  </g>
  <text x="82" y="40" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="url(#keepaisGradient)">
    KeepAIS
  </text>
</svg>
