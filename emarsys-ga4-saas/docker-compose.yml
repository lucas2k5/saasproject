version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=3001
      - ML_SERVICE_URL=http://ml-service:8001
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - ml-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL}
        VITE_REC_API_URL: ${VITE_REC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
      - recommendation-service

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    env_file:
      - .env

  # ── Recommendation Engine (ai-product-recommendation) ──
  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:admin@rec-db:5432/saas_db
      - QDRANT_URL=http://rec-qdrant:6333
      - ALLOWED_ORIGINS=${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      - rec-db
      - rec-redis
      - rec-qdrant

  rec-db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=saas_db
    volumes:
      - rec_postgres_data:/var/lib/postgresql/data

  rec-redis:
    image: redis:alpine

  rec-qdrant:
    image: qdrant/qdrant
    volumes:
      - rec_qdrant_data:/qdrant/storage

volumes:
  caddy_data:
  caddy_config:
  rec_postgres_data:
  rec_qdrant_data:
