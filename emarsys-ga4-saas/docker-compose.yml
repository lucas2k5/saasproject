version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=3001
      - ML_SERVICE_URL=http://ml-service:8001
      - CORS_ORIGIN=http://localhost
    ports:
      - "3001:3001"
    depends_on:
      - ml-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8001:8001"
